<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Avinash cloud operations terminal</title>
  <desc id="desc">A cloud-blue terminal dashboard with a dotted portrait of Avinash, his Cloud Engineering experience, and technology stack.</desc>
  <defs>
    <linearGradient id="border" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0f2942" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="650" rx="22" fill="#06111f"/>
  <rect x="16" y="16" width="1168" height="618" rx="17" fill="url(#grid)" stroke="url(#border)" stroke-width="2"/>
  <path d="M17 58h1166" stroke="#1e5d88"/>
  <circle cx="43" cy="37" r="6" fill="#fb7185"/><circle cx="64" cy="37" r="6" fill="#fbbf24"/><circle cx="85" cy="37" r="6" fill="#34d399"/>
  <text x="600" y="42" fill="#7dd3fc" font-family="monospace" font-size="14" text-anchor="middle">avinash@cloud:~ $ ./profile.sh --live</text>
  <text x="1133" y="42" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="end">● ONLINE</text>

  <rect x="40" y="83" width="490" height="505" rx="13" fill="#071827" stroke="#145b89"/>
  <text x="64" y="111" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="13">CLOUD // K8S MAP</text>
  <path d="M64 121h442" stroke="#145b89"/>
  <image href="portrait-dots.svg" x="45" y="119" width="480" height="465" preserveAspectRatio="xMidYMid meet"/>
  <text x="64" y="560" fill="#60a5fa" font-family="monospace" font-size="12">IDENTITY: VERIFIED // STATUS: PLATFORM NOMINAL</text>

  <rect x="553" y="83" width="607" height="505" rx="13" fill="#071827" stroke="#145b89"/>
  <text x="577" y="111" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="13">SYSTEM.INFO</text>
  <path d="M577 121h559" stroke="#145b89"/>
  <text x="577" y="155" fill="#22d3ee" font-family="monospace" font-size="23" font-weight="bold">avinash@cloud</text>
  <g font-family="monospace" font-size="15">
    <text x="577" y="194" fill="#38bdf8">ROLE</text><text x="735" y="194" fill="#e0f2fe">Cloud Engineer</text>
    <text x="577" y="222" fill="#38bdf8">EXPERIENCE</text><text x="735" y="222" fill="#e0f2fe">4+ years · Cloud / DevOps</text>
    <text x="577" y="250" fill="#38bdf8">FOCUS</text><text x="735" y="250" fill="#e0f2fe">Networking · Monitoring · K8s</text>
  </g>
  <path d="M577 278h559" stroke="#145b89"/>
  <text x="577" y="309" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="bold">CORE STACK</text>
  <g font-family="monospace" font-size="15">
    <text x="577" y="342" fill="#38bdf8">IaC</text><text x="735" y="342" fill="#e0f2fe">Terraform</text>
    <text x="577" y="370" fill="#38bdf8">ORCHESTRATION</text><text x="735" y="370" fill="#e0f2fe">Kubernetes</text>
    <text x="577" y="398" fill="#38bdf8">CLOUD</text><text x="735" y="398" fill="#e0f2fe">Microsoft Azure</text>
    <text x="577" y="426" fill="#38bdf8">AUTOMATION</text><text x="735" y="426" fill="#e0f2fe">GitHub Actions</text>
  </g>
  <path d="M577 453h559" stroke="#145b89"/>
  <text x="577" y="485" fill="#22d3ee" font-family="monospace" font-size="14" font-weight="bold">MISSION</text>
  <text x="577" y="516" fill="#e0f2fe" font-family="monospace" font-size="14">Automate infrastructure. Improve reliability.</text>
  <text x="577" y="540" fill="#e0f2fe" font-family="monospace" font-size="14">Enable teams to ship with confidence.</text>
  <text x="1135" y="565" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="end">SYS READY ▮</text>
  <text x="600" y="618" fill="#60a5fa" font-family="monospace" font-size="11" text-anchor="middle">CLOUD OPS TERMINAL // NETWORK · OBSERVE · AUTOMATE</text>
